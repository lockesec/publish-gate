[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "publish-gate"
version = "0.1.0"
description = "Check a repository for leaks before it goes public, with a negative control that proves it can see"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["secrets", "leak-detection", "open-source", "ai-agents", "pre-publication"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Development Status :: 4 - Beta",
]

[project.urls]
Homepage = "https://github.com/lockesec/publish-gate"
Issues = "https://github.com/lockesec/publish-gate/issues"

[project.scripts]
publish-gate = "publish_gate.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
