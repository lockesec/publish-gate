# GitHub-hosted runners only. Never attach a self-hosted runner to a public
# repository: any pull request author could run code on that machine.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests from source
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pytest -q
      - name: Clean install, then run the installed CLI
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --require-hashes -r requirements-ci.txt
          /tmp/clean/bin/pip install --no-deps --no-build-isolation .
          /tmp/clean/bin/publish-gate --self-test --no-denylist
          /tmp/clean/bin/publish-gate --self-test --no-denylist --history
      - name: README quick start (examples/demo.sh)
        run: PATH=/tmp/clean/bin:$PATH sh examples/demo.sh
      - name: README transcript matches the real output
        run: PATH=/tmp/clean/bin:$PATH python examples/check_readme.py
      - name: The project passes its own gate (tree and history)
        run: |
          /tmp/clean/bin/publish-gate . --no-denylist
          /tmp/clean/bin/publish-gate . --no-denylist --history
